services:
  backend:
    container_name: backend
    image: 221082215561.dkr.ecr.us-east-1.amazonaws.com/rohlik-app:backend-latest
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - TOR_PROXY=socks5://localhost:9050

  frontend:
    container_name: frontend
    image: 221082215561.dkr.ecr.us-east-1.amazonaws.com/rohlik-app:frontend-latest
    pull_policy: always
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    name: app-network
    driver: bridge