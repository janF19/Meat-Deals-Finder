version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Mount the code for development
      - .:/app
      # Exclude volumes to prevent overwriting container directories
      - /app/node_modules
      - /app/__pycache__
      - /app/**/__pycache__
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
      # Add other environment variables as needed
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPOONACULAR_API_KEY=${SPOONACULAR_API_KEY}
    restart: unless-stopped
    # Enable interactive mode for development
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      - backend
    stdin_open: true
    tty: true

networks:
  default:
    name: rohlik-network