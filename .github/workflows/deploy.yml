name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set environment variables
        run: |
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://${{ secrets.EC2_HOST }}" >> $GITHUB_ENV
          echo "BACKEND_URL=http://${{ secrets.EC2_HOST }}:8000" >> $GITHUB_ENV

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ env.REGISTRY }}
          ECR_REPOSITORY: rohlik-app
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AGENTQL_API_KEY: ${{ secrets.AGENTQL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          ALLOWED_ORIGINS: ${{ env.FRONTEND_URL }}
          REACT_APP_API_URL: ${{ env.BACKEND_URL }}
        run: |
          # Build backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG
          
          # Build frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG -f frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA,ECR_REGISTRY
          script: |
            mkdir -p ~/app
            
            # Create .env file
            cat > ~/app/.env << EOL
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            AGENTQL_API_KEY=${{ secrets.AGENTQL_API_KEY }}
            SGAI_API_KEY=${{ secrets.SGAI_API_KEY }}
            SPOONACULAR_API_KEY=${{ secrets.SPOONACULAR_API_KEY }}
            ALLOWED_ORIGINS=http://${{ secrets.EC2_HOST }}
            REACT_APP_API_URL=http://${{ secrets.EC2_HOST }}:8000
            BACKEND_URL=http://${{ secrets.EC2_HOST }}:8000
            EOL
            
            # Create docker-compose.yml
            cat > ~/app/docker-compose.yml << EOL
            version: '3.8'
            
            services:
              backend:
                image: ${ECR_REGISTRY}/rohlik-app:backend-${GITHUB_SHA}
                ports:
                  - "8000:8000"
                env_file:
                  - .env
              
              frontend:
                image: ${ECR_REGISTRY}/rohlik-app:frontend-${GITHUB_SHA}
                ports:
                  - "80:80"
                env_file:
                  - .env
            EOL
            
            # Login to ECR
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            # Pull and run containers
            cd ~/app
            docker-compose pull
            docker-compose up -d