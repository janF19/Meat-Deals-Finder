name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set environment variables
        run: |
          echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "FRONTEND_URL=http://${{ secrets.EC2_HOST }}" >> $GITHUB_ENV
          echo "BACKEND_URL=http://${{ secrets.EC2_HOST }}:8000" >> $GITHUB_ENV

      - name: Build and push Docker images
        env:
          ECR_REGISTRY: ${{ env.REGISTRY }}
          ECR_REPOSITORY: rohlik-app
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AGENTQL_API_KEY: ${{ secrets.AGENTQL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          ALLOWED_ORIGINS: ${{ env.FRONTEND_URL }}
          REACT_APP_API_URL: ${{ env.BACKEND_URL }}
        run: |
          # Build and push backend with both specific and latest tags
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest -f Dockerfile.deploy .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:backend-latest
          
          # Build and push frontend with both specific and latest tags
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest -f frontend/Dockerfile.deploy ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

      - name: Debug connection info
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_DNS: "ec2-54-172-5-169.compute-1.amazonaws.com"  # Use your EC2's public DNS
        shell: bash
        run: |
          echo "Testing connection to $EC2_DNS"
          echo "Username: ubuntu"
          echo "Testing SSH..."
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem
          
          # Network diagnostics
          echo "Running ping test..."
          ping -c 4 $EC2_DNS
          
          echo "Running traceroute..."
          traceroute $EC2_DNS
          
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -i key.pem -vvv ubuntu@$EC2_DNS
          
      - name: Test direct TCP connection
        run: |
          nc -zv ${{ secrets.EC2_HOST }} 22 -w 10

      - name: Debug SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          debug: true
          use_insecure_cipher: true
          script: |
            echo "Connection successful!"
            pwd
            ls -la

      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.deploy.yml"
          target: "~/app"

      # Then run the deployment script
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          GITHUB_SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ env.REGISTRY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA,ECR_REGISTRY
          script: |
            # Verify docker-compose file exists
            if [ ! -f ~/app/docker-compose.deploy.yml ]; then
              echo "Error: docker-compose.deploy.yml not found!"
              exit 1
            fi
            
            mkdir -p ~/app
            
            # Create .env file with explicit exports
            cat > ~/app/.env << EOL
            export DB_USER='${{ secrets.DB_USER }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DB_HOST='${{ secrets.DB_HOST }}'
            export DB_PORT='${{ secrets.DB_PORT }}'
            export DB_NAME='${{ secrets.DB_NAME }}'
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
            export AGENTQL_API_KEY='${{ secrets.AGENTQL_API_KEY }}'
            export SGAI_API_KEY='${{ secrets.SGAI_API_KEY }}'
            export SPOONACULAR_API_KEY='${{ secrets.SPOONACULAR_API_KEY }}'
            export ALLOWED_ORIGINS='http://${{ secrets.EC2_HOST }}'
            export REACT_APP_API_URL='http://${{ secrets.EC2_HOST }}:8000'
            export BACKEND_URL='http://${{ secrets.EC2_HOST }}:8000'
            EOL
            
            chmod 600 ~/app/.env
            cd ~/app
            
            # Stop and remove existing containers
            docker-compose -f docker-compose.deploy.yml down -v || true
            docker system prune -af
            
            # Login to ECR
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ECR_REGISTRY}
            
            # Pull and start new containers
            docker-compose -f docker-compose.deploy.yml pull
            docker-compose -f docker-compose.deploy.yml up -d
            
            # Show logs
            docker-compose -f docker-compose.deploy.yml logs